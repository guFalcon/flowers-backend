services:
  backend:
    image: gufalcon/flowers-backend:latest
    restart: unless-stopped
    container_name: flowers-backend
    environment:
      - LANGUAGE=de_AT:de
      # Admin token for /api/admin/*; written into deploy/.env by the deploy workflow (EXTRA_ENV)
      - FLOWERS_ADMIN_TOKEN=${FLOWERS_ADMIN_TOKEN}
    labels:
      - traefik.enable=true
      - traefik.http.routers.flowers-backend.entrypoints=web,websecure,web-ext,websecure-ext
      - traefik.http.routers.flowers-backend.rule=Host(`flowers-backend.htl.dev`)
      - traefik.http.services.flowers-backend.loadbalancer.server.port=8084

networks:
  default:
    name: proxy_default
    external: true
