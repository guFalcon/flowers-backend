# Enable CORS
quarkus.http.cors.enabled=true
quarkus.http.port=8084

quarkus.http.cors.methods=GET,POST,OPTIONS
quarkus.http.cors.headers=accept,content-type,x-admin-token

quarkus.http.cors.access-control-allow-credentials=false
quarkus.http.cors.origins=https://flowers.htl.dev,http://localhost:8080,http://localhost:8081

# Admin token for /api/admin/* (header X-Admin-Token); blank means every admin request is refused
flowers.admin-token=${FLOWERS_ADMIN_TOKEN:}
%dev.flowers.admin-token=dev-admin-token
%test.flowers.admin-token=test-admin-token
