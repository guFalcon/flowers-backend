schema: spec-driven

context: |
  flowers — a small multiplayer browser game (bees harvest honey from flowers), used for teaching
  at HTL. Two repositories, one spec tree (this one):
    - flowers-backend (this repo): Java 21, Quarkus, Maven wrapper. REST + SSE under /api via
                  Quarkus REST + Jackson, Mutiny Multi for the SSE stream. In-memory game state,
                  no database. Port 8084. Tests: JUnit 5 + AssertJ, @QuarkusTest + REST Assured.
    - flowers-frontend (~/source/htl/js/flowers-frontend): plain HTML/CSS/JS, no framework, no
                  build step, served by a minimal Express server (port 8081, Node 20). Talks to
                  the backend via fetch + EventSource; base URL is the SERVER constant in index.html.
    - deploy/ in each repo: docker compose behind an external Traefik; every push to main
                  redeploys (flowers.htl.dev, flowers-backend.htl.dev).
    - http/     : .http request files that exercise the backend REST API.
    - ai/       : memory and open proposals (backend repo only).
  All repo content (code, comments, logs, docs, commits, OpenSpec artifacts) is English.
  Conventional commits.

rules:
  proposal:
    - State which repos are affected (backend, frontend, deploy/CI) in the Impact section.
    - Include a Non-goals section.
  design:
    - When the REST/SSE contract changes, show the exact request/response shapes and event payloads.
  tasks:
    - Group tasks by repo (Backend, Frontend, Deploy/CI, Verification).
    - Any REST/SSE contract change includes tasks for the backend resource, the frontend calls/handlers, and .http files under http/.
    - Include test tasks for every backend behaviour change (JUnit/AssertJ, @QuarkusTest); frontend behaviour is checked with a headless browser.
