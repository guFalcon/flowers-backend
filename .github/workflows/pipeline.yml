name: PIPELINE

permissions:
  contents: write

on:
  push:
    branches:
      - 'main'
  workflow_dispatch:

jobs:
  bump:
    uses: UnterrainerInformatik/bump-semver-workflow/.github/workflows/workflow.yml@master
  build:
    name: Build and deploy 🔨
    runs-on: [ self-hosted, Linux, X64 ]
    needs: [ bump ]
    steps:
      - name: Init Runner ⚙️
        uses: UnterrainerInformatik/init-runner-action@master
        with:
          self_hosted: 'true'

      - name: Set up JDK 21 ⚙️
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Update pom.xml version 💾
        run: |
          ./mvnw versions:set -DnewVersion=${{ needs.bump.outputs.major_version }}.${{ needs.bump.outputs.minor_version }}.${{ needs.bump.outputs.build_version }} -DgenerateBackupPoms=false

      - name: Build with Maven 🔨
        run: ./mvnw package -DskipTests

      - name: Upload target
        uses: actions/upload-artifact@v7
        with:
          name: app-target
          path: target/quarkus-app

  docker-build:
    name: Build Docker Image 🐋
    runs-on: ubuntu-latest
    needs: [ bump, build ]
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: target
        uses: actions/download-artifact@v8
        with:
          name: app-target
          path: target/quarkus-app

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_HUB_USER }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ./
          file: src/main/docker/Dockerfile.jvm
          platforms: linux/amd64
          push: true
          tags: ${{ secrets.DOCKER_HUB_USER }}/${{ secrets.DOCKER_IMAGE_NAME}}:latest
    
  deploy:
    uses: UnterrainerInformatik/deploy-workflow/.github/workflows/workflow.yml@master
    needs: [ bump, build, docker-build ]
    with:
      major_version: ${{ needs.bump.outputs.major_version }}
      minor_version: ${{ needs.bump.outputs.minor_version }}
      build_version: ${{ needs.bump.outputs.build_version }}
    secrets:
      DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
      DEPLOY_SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
      DEPLOY_SERVER: ${{ secrets.DEPLOY_SERVER }}
      DEPLOY_SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT }}
      DEPLOY_DIR: ${{ secrets.DEPLOY_DIR }}
      DATA_DIR: ${{ secrets.DATA_DIR }}
      DOCKER_HUB_USER: ${{ secrets.DOCKER_HUB_USER }}
      DOCKER_IMAGE_NAME: ${{ secrets.DOCKER_IMAGE_NAME }}
      EXTRA_ENV: FLOWERS_ADMIN_TOKEN=${{ secrets.FLOWERS_ADMIN_TOKEN }}